# 社内備品貸出管理システム Nginx設定
# ・HTTP(80)はHTTPS(443)へ転送する
# ・証明書（社内認証局発行または自己署名）は /etc/nginx/certs に配置する（リポジトリには含めない）
#     server.crt ：証明書、server.key ：秘密鍵
# ・/api はバックエンド（backend:8000）へ中継する
# ・それ以外は静的ファイルを返し、存在しないパスはindex.html（画面側ルーティング）を返す

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # CSVインポートの上限に合わせる
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
